# Build & test on every push to main and on pull requests (plus manual dispatch).
# The crate has no dependencies: one job, test + clippy.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-${{ vars.VYGES_UBUNTU_VERSION || '24.04' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test
        run: cargo test --release --verbose
      - name: Test with the loom loader (and the correlation)
        run: cargo test --release --features loom --verbose
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy with the loom loader
        run: cargo clippy --all-targets --features loom -- -D warnings
