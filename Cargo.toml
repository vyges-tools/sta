[package]
name = "vyges-sta"
version = "0.1.55"
edition = "2021"
description = "Static timing analysis with fully specified arithmetic: delays, arrivals, requireds and slacks reproducible bit for bit."
license = "Apache-2.0"
authors = ["Vyges <https://vyges.com/contact>"]
homepage = "https://vyges.com"
repository = "https://github.com/vyges-tools/sta"

[lib]
name = "vyges_sta"
path = "src/lib.rs"

[features]
# A design read by loom (Verilog), mapped into this timer's netlist: `load`. Off by default, so
# the library itself keeps no dependencies.
loom = ["dep:vyges-loom"]

[dependencies]
vyges-loom = { git = "https://github.com/vyges-tools/loom.git", branch = "main", optional = true }

[[example]]
name = "load_graph"
required-features = ["loom"]

[[test]]
name = "correlation"
required-features = ["loom"]
